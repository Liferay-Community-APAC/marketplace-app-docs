name: Feature request
description: Suggest an improvement to a Marketplace App.
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - Liferay Forums
        - Liferay Legacy MCP
        - Liferay Usage Intelligence
        - Liferay Migration Studio
        - AI Hub Legacy Connector
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How the app could solve it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you've tried
  - type: input
    id: dxp-version
    attributes:
      label: Liferay DXP version you'd use it on
      placeholder: "2026.Q1.2 LTS"
